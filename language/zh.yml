# ============================================================
# 中文字典(基准 · 页面文案的唯一来源)
#
# 翻译契约(详见 docs/06-国际化架构.md):
#   - 键 = 稳定词条 ID,值 = 页面实际渲染的中文;模板用 zh('键') 渲染、
#     JS 用 i18n.get('键') 取词,不再各自硬编码中文;
#   - 其余语言(en/ja/ru.yml)同键,值 = 对应译文;
#   - 运行期只按词条 ID 换文案,不做 DOM 全页扫描,
#     正文/标题/标签/分类等"内容"永远不会被误翻。
#
# ★ 每一节都标注了使用它的模板/脚本,改文案前可按图索骥;
#   反过来在模板里看到 zh('xxx') / i18n.get('xxx'),来本文件搜键名即可。
# 新增词条:四个 yml 加同名键,重新 hexo generate 生效;
#   配合 npm run check:cjk 检查模板/脚本里还有没有漏网的裸中文。
# ============================================================

