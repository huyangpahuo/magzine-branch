# ============================================================
# 关于页数据(about.pug 读取)
#
# ★ profile(个人资料)与 skills(技能标签)是"会增删的词条":
#   直接在这里加/删条目即可,每条自带 _en/_ja/_ru 可选字段,
#   不写某语言字段就原样显示中文,字典和模板都不用动。
#   渲染见 about.pug 的 .profile-info-content / .interest-cloud。
# ============================================================

